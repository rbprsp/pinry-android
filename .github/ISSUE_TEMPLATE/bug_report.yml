name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Settings → bottom of the screen, or the release you installed.
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and device
      placeholder: Android 16, Pixel 8
    validations:
      required: true
  - type: input
    id: pinry
    attributes:
      label: Pinry server version
      placeholder: 2.1.13
  - type: dropdown
    id: instance
    attributes:
      label: Server setup
      multiple: true
      options:
        - Public instance
        - Private instance (PUBLIC = False)
        - https
        - Plain http on a LAN
        - Behind a reverse proxy
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Remove server addresses, usernames and tokens before posting.
